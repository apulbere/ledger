name: ledger

services:
  journal-postgres:
    image: postgres:18
    # Debezium reads the journal's write-ahead log. A stopped connector's slot pins WAL:
    # cap it so a forgotten slot cannot fill the disk (the slot is then invalidated).
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=1GB"]
    environment:
      POSTGRES_DB: journal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - journal-pgdata:/var/lib/postgresql
      - ./docker/postgres/journal-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d journal"]
      interval: 5s
      timeout: 5s
      retries: 20

  query-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: query
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - query-pgdata:/var/lib/postgresql
      - ./docker/postgres/query-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d query"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by their producers with explicit settings (Connect for the journal topics);
      # a consumer starting first must not create one with broker defaults (7-day retention).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.3
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8085:8081"
    healthcheck:
      # cp-schema-registry 8.x has no curl; probe over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /subjects HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  kafka-connect:
    build: docker/kafka-connect
    depends_on:
      journal-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: ledger-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Registers the Debezium connector once Connect is up and journal has migrated (publication exists).
  # PUT of the config is idempotent: re-running it leaves a running connector as it is.
  connector-init:
    image: curlimages/curl:8.11.1
    depends_on:
      kafka-connect:
        condition: service_healthy
      journal-app:
        condition: service_healthy
    volumes:
      - ./docker/kafka-connect/connectors:/connectors:ro
    command:
      - -fsS
      - -X
      - PUT
      - -H
      - "Content-Type: application/json"
      - --data
      - "@/connectors/journal-cdc.json"
      - http://kafka-connect:8083/connectors/journal-cdc/config
    restart: "no"

  journal-app:
    build:
      context: .
      dockerfile: services/journal/journal-app/Dockerfile
    depends_on:
      journal-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://journal-postgres:5432/journal
    ports:
      - "8080:8080"
    healthcheck:
      # The JRE image has no curl; probe over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  query-app:
    build:
      context: .
      dockerfile: services/query/query-app/Dockerfile
    depends_on:
      query-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://query-postgres:5432/query
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8081:8081"
    healthcheck:
      # The JRE image has no curl; probe over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One Swagger UI for every service's hand-written REST contract. Each service still owns its
  # openapi.yaml and validates its traffic against it in its own tests.
  # To add a service: mount its document under /specs, list it in URLS, and route it in the gateway.
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.0
    environment:
      URLS: >-
        [{"name": "journal", "url": "/specs/journal.yaml"}, {"name": "query", "url": "/specs/query.yaml"}]
      URLS_PRIMARY_NAME: journal
    volumes:
      - ./services/journal/journal-app/src/main/openapi/openapi.yaml:/usr/share/nginx/html/specs/journal.yaml:ro
      - ./services/query/query-app/src/main/openapi/openapi.yaml:/usr/share/nginx/html/specs/query.yaml:ro

  # Swagger UI at / and each service under its prefix (/journal/..., /query/...), all on one origin.
  gateway:
    image: nginx:1.29.3-alpine
    depends_on:
      - swagger-ui
    volumes:
      - ./docker/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"

volumes:
  journal-pgdata:
  query-pgdata:
