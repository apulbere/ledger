[versions]
java = "27"
spring-boot = "4.1.2"
avro = "1.12.2"
junit = "6.0.3"
swagger-request-validator = "2.44.9"
springdoc = "3.2.0"

[libraries]
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
avro-compiler = { module = "org.apache.avro:avro-compiler", version.ref = "avro" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
swagger-request-validator = { module = "com.atlassian.oai:swagger-request-validator-core", version.ref = "swagger-request-validator" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
