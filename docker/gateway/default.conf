# Local API gateway: Swagger UI and every service's REST API on one origin, so "Try it out" needs no CORS.
# Each service's contract declares its prefix as its server (e.g. /journal); the prefix is stripped here.
# To add a service: a location below, its document in swagger-ui's URLS (docker-compose.yml).

# Docker's DNS, resolved per request: the gateway starts without waiting for the apps and follows restarts.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    location / {
        set $upstream swagger-ui:8080;
        proxy_pass http://$upstream;
    }

    location /journal/ {
        set $upstream journal-app:8080;
        rewrite ^/journal/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /query/ {
        set $upstream query-app:8081;
        rewrite ^/query/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
}
