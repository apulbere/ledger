# One formatted SQL file per changeset, named after its id, under changes/; applied in the order listed here.
databaseChangeLog:
  - include: { file: changes/create-schema-query.sql, relativeToChangelogFile: true }
  - include: { file: changes/create-table-transaction.sql, relativeToChangelogFile: true }
  - include: { file: changes/create-table-account-transaction.sql, relativeToChangelogFile: true }
  - include: { file: changes/create-table-balance-version.sql, relativeToChangelogFile: true }
