# Migrations are formatted SQL files under changes/, applied in the order listed here.
databaseChangeLog:
  - include: { file: changes/001-create-schema-journal.sql, relativeToChangelogFile: true }
  - include: { file: changes/002-create-table-transaction.sql, relativeToChangelogFile: true }
  - include: { file: changes/003-create-table-balance.sql, relativeToChangelogFile: true }
  - include: { file: changes/004-transaction-append-only.sql, relativeToChangelogFile: true }
  - include: { file: changes/005-split-balance-debit-credit.sql, relativeToChangelogFile: true }
