# One formatted SQL file per changeset, named after its id, under changes/; applied in the order listed here.
databaseChangeLog:
  - include: { file: changes/create-schema-journal.sql, relativeToChangelogFile: true }
  - include: { file: changes/create-table-transaction.sql, relativeToChangelogFile: true }
  - include: { file: changes/create-table-balance.sql, relativeToChangelogFile: true }
  - include: { file: changes/transaction-append-only.sql, relativeToChangelogFile: true }
  - include: { file: changes/split-balance-debit-credit.sql, relativeToChangelogFile: true }
