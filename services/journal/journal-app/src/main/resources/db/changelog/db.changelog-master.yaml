databaseChangeLog:
  - changeSet:
      id: create-schema-journal
      author: ledger
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS journal
  - changeSet:
      id: create-table-transaction
      author: ledger
      changes:
        - sql:
            sql: |
              CREATE TABLE journal.transaction (
                  id              uuid        PRIMARY KEY,
                  idempotency_key text        NOT NULL CONSTRAINT transaction_idempotency_key_uk UNIQUE,
                  reference_id    text,
                  occurred_at     timestamptz NOT NULL,
                  posted_at       timestamptz NOT NULL DEFAULT now(),
                  description     text,
                  metadata        jsonb,
                  entries         jsonb       NOT NULL,
                  versions        jsonb       NOT NULL
              )
  - changeSet:
      id: create-table-balance
      author: ledger
      changes:
        - sql:
            sql: |
              CREATE TABLE journal.balance (
                  account_id          text    NOT NULL,
                  currency            char(3) NOT NULL,
                  available           bigint  NOT NULL,
                  held                bigint  NOT NULL,
                  version             bigint  NOT NULL,
                  last_transaction_id uuid    NOT NULL,
                  PRIMARY KEY (account_id, currency)
              )
  - changeSet:
      id: transaction-append-only
      author: ledger
      changes:
        - sql:
            # journal_user owns the table, so REVOKE alone would not stop it.
            splitStatements: false
            sql: |
              CREATE FUNCTION journal.reject_transaction_change() RETURNS trigger
              LANGUAGE plpgsql AS $$
              BEGIN
                  RAISE EXCEPTION 'journal.transaction is append-only: % rejected', TG_OP;
              END
              $$;
              CREATE TRIGGER transaction_append_only
                  BEFORE UPDATE OR DELETE ON journal.transaction
                  FOR EACH ROW EXECUTE FUNCTION journal.reject_transaction_change();
